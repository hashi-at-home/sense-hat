[settings]
python.uv_venv_auto = "create|source"

[env]
_.python.venv = { path = ".venv", create = true, uv_create_args = ['--seed'] }

[tools]
prek = '0.5'
uv = '0.13'
python = "3.14"
ruff = "latest"

[tasks.install]
description = "Install all tools"
alias = "i"
run = "uv pip install -r requirements.txt"
